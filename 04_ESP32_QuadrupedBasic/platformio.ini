[platformio]
default_envs = front_master
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/quadruped_basic
build_dir = ${sysenv.USERPROFILE}/.platformio/build/quadruped_basic

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = askuric/Simple FOC@2.3.3
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_flags = -Wall -DARDUINO_RUNNING_CORE=0

[env:front_master]
build_flags = ${env.build_flags} -DROBOT_MASTER=1

[env:rear_follower]
build_flags = ${env.build_flags} -DROBOT_MASTER=0
