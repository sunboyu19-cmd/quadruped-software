[platformio]
default_envs = s3_sensor_test
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/single_wheel_foc_s3
build_dir = ${sysenv.USERPROFILE}/.platformio/build/single_wheel_foc_s3

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = askuric/Simple FOC@2.3.3

; ESP32-S3-WROOM-2-N32R16V: inherited hardware memory configuration
; from the teleoperation project; Arduino core pinned to compatible 2.0.17.
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = partitions_32MB.csv
board_build.filesystem = littlefs
upload_speed = 460800
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = send_on_enter
monitor_echo = yes
build_flags =
    -Wall
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:s3_sensor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=0

[env:s3_motor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=1

; Sequential testing: left leg uses the same wiring as the right leg.
[env:s3_left_sensor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=0 -DFOC_LEG_ID=2

[env:s3_left_motor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=1 -DFOC_LEG_ID=2
