[platformio]
default_envs = wheel_diagnostic
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/quad_wheel_diagnostic
build_dir = ${sysenv.USERPROFILE}/.platformio/build/quad_wheel_diagnostic
[env:wheel_diagnostic]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = askuric/Simple FOC@2.3.3
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -Wall -std=gnu++17 -DARDUINO_RUNNING_CORE=0
