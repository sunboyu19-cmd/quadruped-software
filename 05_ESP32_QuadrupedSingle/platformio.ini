[platformio]
default_envs = single_esp32
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/quadruped_single
build_dir = ${sysenv.USERPROFILE}/.platformio/build/quadruped_single

[env:single_esp32]
platform = espressif32@6.9.0
board = esp32dev
board_build.partitions = min_spiffs.csv
framework = arduino
lib_deps = askuric/Simple FOC@2.3.3
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_unflags = -std=gnu++11
build_flags = -Wall -std=gnu++17 -DARDUINO_RUNNING_CORE=0 -DROBOT_MASTER=1
