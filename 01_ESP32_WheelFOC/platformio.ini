


[platformio]
default_envs = sensor_test
; Keep dependency/build paths short: Windows legacy tools can hit MAX_PATH.
libdeps_dir = ${sysenv.USERPROFILE}/.platformio/libdeps/single_wheel_foc
build_dir = ${sysenv.USERPROFILE}/.platformio/build/single_wheel_foc

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
lib_deps = askuric/Simple FOC@2.3.3
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = -Wall

[env:sensor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=0

[env:motor_test]
build_flags = ${env.build_flags} -DFOC_ENABLE_MOTOR=1
