[platformio]
default_envs = i2c_diagnostic
build_dir = ${sysenv.USERPROFILE}/.platformio/build/quad_i2c_diagnostic
[env:i2c_diagnostic]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
upload_speed = 115200
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_eol = LF
monitor_filters = send_on_enter
build_flags = -Wall
